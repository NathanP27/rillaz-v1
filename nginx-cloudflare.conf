# Cloudflare & NGINX Asset Caching & Compression Rules

# 1. Cloudflare CDN Headers (add via Page Rules or Transform Rules)
# Target: https://gymrillaz.com/images/* or https://gymrillaz.com/_next/static/*
# Cache-Control: public, max-age=31536000, immutable
# Cloudflare Edge Cache TTL: 1 month

# 2. Recommended NGINX Reverse Proxy Configuration
server {
    listen 80;
    server_name gymrillaz.com www.gymrillaz.com;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    # API Proxy to FastAPI
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Application Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
