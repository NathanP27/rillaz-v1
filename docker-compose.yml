version: "3.8"

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gymrillaz_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    depends_on:
      - api

  # FastAPI Backend Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymrillaz_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gymrillaz:gymrillaz_secret@postgres:5432/gymrillaz_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_RECEIVER_EMAIL=${CONTACT_RECEIVER_EMAIL:-leads@gymrillaz.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Asynchronous Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymrillaz_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_RECEIVER_EMAIL=${CONTACT_RECEIVER_EMAIL:-leads@gymrillaz.com}
    depends_on:
      - redis

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: gymrillaz_postgres
    restart: always
    environment:
      POSTGRES_USER: gymrillaz
      POSTGRES_PASSWORD: gymrillaz_secret
      POSTGRES_DB: gymrillaz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymrillaz -d gymrillaz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: gymrillaz_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
